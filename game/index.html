<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>작은 방</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #1a1420; height: 100%; }
  canvas { display: block; touch-action: none; }
  #hint {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    color: #fdf6ec;
    font-family: -apple-system, "Pretendard", "Malgun Gothic", sans-serif;
    font-size: 14px;
    letter-spacing: 0.02em;
    background: rgba(20, 14, 24, 0.55);
    padding: 8px 16px;
    border-radius: 999px;
    pointer-events: none;
    transition: opacity 0.6s ease;
    user-select: none;
  }
  #hint.hidden { opacity: 0; }
  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #1a1420; color: #fdf6ec;
    font-family: -apple-system, "Pretendard", "Malgun Gothic", sans-serif;
    font-size: 14px; letter-spacing: 0.05em; z-index: 10;
    transition: opacity 0.4s ease;
  }
</style>
</head>
<body>
  <div id="loading">불러오는 중…</div>
  <div id="hint" class="hidden">드래그로 둘러보기 · 스탠드를 클릭해보세요</div>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
